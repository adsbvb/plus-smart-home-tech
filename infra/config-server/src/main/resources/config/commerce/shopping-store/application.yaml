server:
  port: 0

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/analyzer
    username: commerce_user
    password: commerce_password
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    hibernate:
      ddl-auto: update
    open-in-view: false